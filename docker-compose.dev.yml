version: "3.9"

services:

  db:
    image: postgres:14.1
    container_name: postgres
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB=devops
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres-data:/var/lib/postgresql/data/

  pgadmin:
    container_name: pgadmin4_container
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: 'pg_pass'
    ports:
      - "5050:80"

  rabbitmq:
    image: "rabbitmq:alpine"
    container_name: rabbitmq
    ports:
      - "5672:5672"   # برای اتصال Celery از ویندوز به broker
      - "15672:15672" # برای داشبورد مدیریتی RabbitMQ
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3

  redis:
    image: redis:7
    container_name: redis
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data
  celery-worker:
    build:
      context: .
      dockerfile: docker/production.Dockerfile
    command: celery -A devops.tasks worker -l info --without-gossip --without-mingle --without-heartbeat
    container_name: worker-worker
    environment:
      - DATABASE_URL=psql://user:password@db:5432/devops
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
    volumes:
      - .:/app
    pull_policy: never
    depends_on:
      - db
      - rabbitmq
    restart: on-failure

volumes:
    postgres-data:
    redis-data:

